<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Game — Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial, sans-serif;
  background:#070a13;
  color:#f3f4f6;
  padding:15px;
  padding-bottom:50px;
}
.app{
  max-width:550px;
  margin:0 auto;
}
.header{
  background:linear-gradient(135deg,#312e81,#1e1b4b);
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.header h1{
  font-size:18px;
  color:#60a5fa;
  margin-bottom:5px;
}
.header p{
  font-size:12px;
  color:#9ca3af;
}
.card{
  background:#131c2e;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 6px 15px rgba(0,0,0,0.3);
}
.card-title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:12px;
  color:#e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}
.stat-box{
  background:#090d16;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.05);
  text-align:center;
}
.stat-box small{
  color:#9ca3af;
  font-size:11px;
  text-transform:uppercase;
}
.stat-box h2{
  font-size:20px;
  margin-top:4px;
  color:#34d399;
}
.form-group{
  margin-bottom:12px;
}
.form-group label{
  display:block;
  color:#9ca3af;
  font-size:11px;
  margin-bottom:6px;
  text-transform:uppercase;
}
.form-control{
  width:100%;
  background:#090d16;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  color:#fff;
  font-size:14px;
  font-weight:bold;
}
.btn{
  width:100%;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:#fff;
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
  font-size:13px;
  cursor:pointer;
  margin-top:5px;
  box-shadow:0 4px 12px rgba(59,130,246,0.3);
}
.btn-danger{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  box-shadow:0 4px 12px rgba(239,68,68,0.3);
}
.user-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#090d16;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.05);
  margin-bottom:6px;
  font-size:12px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  background:#1e293b;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  transition:0.3s;
  pointer-events:none;
  z-index:999;
  border:1px solid rgba(255,255,255,0.1);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <header class="header">
    <h1>⚙️ አስተዳዳሪ ዳሽቦርድ (Admin Panel)</h1>
    <p>የVIP ቁጥር ጨዋታ ቁጥጥር እና ክትትል ማዕከል</p>
  </header>

  <!-- OVERVIEW STATS -->
  <div class="stats-grid">
    <div class="stat-box">
      <small>አጠቃላይ ሽያጭ (Total Sales)</small>
      <h2 id="totalSales">2,450 CR</h2>
    </div>
    <div class="stat-box">
      <small>የተጫዋቾች ብዛት (Total Players)</small>
      <h2 id="totalPlayers" style="color:#60a5fa">42</h2>
    </div>
    <div class="stat-box">
      <small>የተሸለመው ድምር (Total Payout)</small>
      <h2 id="totalPayout" style="color:#f87171">1,200 CR</h2>
    </div>
    <div class="stat-box">
      <small>የድርጅቱ ገቢ (Net Profit)</small>
      <h2 id="netProfit">1,250 CR</h2>
    </div>
  </div>

  <!-- GAME CONTROL CARD -->
  <section class="card">
    <div class="card-title">
      <span>የዙር ቁጥር እና አሸናፊ ማስተካከያ</span>
      <span style="color:#f59e0b">Active Round #001</span>
    </div>
    
    <div class="form-group">
      <label>ቀጣይ የሚወጣውን አሸናፊ ቁጥር ያስገቡ (ማስተካከያ)</label>
      <input type="text" id="adminWinningNum" class="form-control" placeholder="ምሳሌ: 045 (ባዶ ከቀሩ በራሱ በዘፈቀደ ይወጣል)" maxlength="3">
    </div>

    <button class="btn" onclick="saveAdminSettings()">⚙️ ቅንብሮቹን አስቀምጥ</button>
  </section>

  <!-- RECENT PLAYERS LIST -->
  <section class="card">
    <div class="card-title">
      <span>የቅርብ ጊዜ ተጫዋቾች እንቅስቃሴ</span>
      <span id="playerListCount">3 ተጫዋቾች</span>
    </div>
    <div id="adminPlayerList">
      <!-- Dynamic list -->
    </div>
  </section>

  <!-- SYSTEM ACTIONS -->
  <section class="card">
    <div class="card-title"><span>ፈጣን ትዕዛዞች</span></div>
    <button class="btn btn-danger" onclick="resetSystemData()">🗑️ የሁሉንም ተጫዋቾች መረጃ አጽዳ (Reset)</button>
  </section>
</div>

<div id="toast" class="toast"></div>

<script>
let adminState = {
  sales: 2450,
  players: 42,
  payout: 1200,
  profit: 1250,
  recentUsers: [
    { name: "ተጫዋች #1084", bet: "6 ቁጥሮች (120 CR)", status: "WIN", time: "8:15 PM" },
    { name: "ተጫዋች #1083", bet: "2 ቁጥሮች (40 CR)", status: "LOSS", time: "8:10 PM" },
    { name: "ተጫዋች #1082", bet: "6 ቁጥሮች (120 CR)", status: "LOSS", time: "8:02 PM" }
  ]
};

function initAdmin() {
  document.getElementById("totalSales").textContent = adminState.sales + " CR";
  document.getElementById("totalPlayers").textContent = adminState.players;
  document.getElementById("totalPayout").textContent = adminState.payout + " CR";
  document.getElementById("netProfit").textContent = adminState.profit + " CR";
  renderAdminUsers();
}

function saveAdminSettings() {
  const num = document.getElementById("adminWinningNum").value.trim();
  if(num) {
    showToast(`አሸናፊ ቁጥር ወደ [${num.padStart(3, '0')}] ተስተካክሏል!`);
  } else {
    showToast("በዘፈቀደ (Random) እንዲወጣ ተደረገ!");
  }
}

function renderAdminUsers() {
  const container = document.getElementById("adminPlayerList");
  container.innerHTML = "";
  
  adminState.recentUsers.forEach(u => {
    const row = document.createElement("div");
    row.className = "user-row";
    row.innerHTML = `
      <div>
        <b>${u.name}</b> (${u.bet})
        <small style="display:block;color:#9ca3af;margin-top:2px">${u.time}</small>
      </div>
      <div style="font-weight:bold; color:${u.status === 'WIN' ? '#34d399' : '#f87171'}">${u.status}</div>
    `;
    container.appendChild(row);
  });
  document.getElementById("playerListCount").textContent = adminState.recentUsers.length + " ተጫዋቾች";
}

function resetSystemData() {
  if(confirm("እርግጠኛ ኖት የሲስተሙን መረጃዎች ማጥፋት ይፈልጋሉ?")) {
    adminState.sales = 0;
    adminState.players = 0;
    adminState.payout = 0;
    adminState.profit = 0;
    adminState.recentUsers = [];
    initAdmin();
    showToast("መረጃዎቹ ሙሉ በሙሉ ታድሰዋል (Reset)!");
  }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.timer);
  window.timer = setTimeout(() => {
    t.classList.remove("show");
  }, 2000);
}

initAdmin();
</script>

</body>
</html>
